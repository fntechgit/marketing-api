services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: marketing-api
    command: python manage.py runserver 0.0.0.0:8007
    container_name: marketing-api
    restart: unless-stopped
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    networks:
      - marketing-api-local-net
    ports:
      - "8007:8007"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
  redis:
    image: redis:latest
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}
    volumes:
      - /tmp/marketing_api/redis:/root/redis
      - ./docker-compose/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - marketing-api-local-net
    env_file: ./backend/.env
  db:
    image: mysql:8.0
    container_name: marketing-db-local
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    ports:
      - "30785:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    volumes:
      - ./docker-compose/mysql:/docker-entrypoint-initdb.d
      - marketing_db_data:/var/lib/mysql
    networks:
      - marketing-api-local-net
    env_file: ./backend/.env
volumes:
  marketing_db_data:
networks:
  marketing-api-local-net:
    driver: bridge