services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: marketing-api
    command: python manage.py runserver 0.0.0.0:8007
    container_name: marketing-api
    restart: unless-stopped
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    networks:
      - marketing-api-local-net
    ports:
      - "8007:8007"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
  redis:
    image: redis:latest
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}
    volumes:
      - /tmp/marketing_api/redis:/root/redis
      - ./docker-compose/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - marketing-api-local-net
    env_file: ./backend/.env
  db:
    image: mysql:8.4
    container_name: marketing-db-local
    command: --mysql-native-password=ON
    restart: unless-stopped
    ports:
      - "30785:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    volumes:
      - ./docker-compose/mysql:/docker-entrypoint-initdb.d
      - marketing_db_data:/var/lib/mysql
    networks:
      - marketing-api-local-net
    env_file: ./backend/.env
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_IMAGE_TAG}
    profiles: ["otel"]
    # The image runs as UID 10001, which cannot write to logs/otel on a Linux host. As the host user
    # it writes to the committed logs/otel, and its files stay readable without sudo.
    user: "${OTEL_COLLECTOR_USER:-1000:1000}"
    volumes:
      - ./docker-compose/opentelemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - ./logs/otel:/var/log/otel
    # Loopback only: the receivers and the diagnostic endpoints take no authentication. The app
    # container reaches the collector as otel-collector on the compose network.
    ports:
      - "127.0.0.1:1888:1888" # pprof extension
      - "127.0.0.1:8888:8888" # Prometheus metrics exposed by the Collector
      - "127.0.0.1:8889:8889" # Prometheus exporter metrics
      - "127.0.0.1:13133:13133" # health_check extension
      - "127.0.0.1:4317:4317" # OTLP gRPC receiver
      - "127.0.0.1:4318:4318" # OTLP HTTP receiver
      - "127.0.0.1:55679:55679" # zpages extension
    networks:
      - marketing-api-local-net
volumes:
  marketing_db_data:
networks:
  marketing-api-local-net:
    driver: bridge